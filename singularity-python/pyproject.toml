[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-dkcs"
version = "0.2.0"
description = "Open-source core of the SINGULARITY Disaggregated KV-Cache Service (context teleportation)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SINGULARITY contributors" }]
keywords = ["llm", "inference", "kv-cache", "vllm", "rdma", "disaggregation"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "grpcio>=1.60; python_version >= \"3.10\"", "protobuf>=7.35,<8; python_version >= \"3.10\"", "pyshackle>=1.0"]
# The checked-in protobuf stubs carry gencode 7.35 (grpcio-tools 1.85),
# which needs a protobuf 7.x runtime — and protobuf 7.x needs Python
# >= 3.10. The base package still supports 3.9; this extra does not,
# and on 3.9 the install fails loudly rather than half-working.
grpc = ["grpcio>=1.60", "protobuf>=7.35,<8"]
governance = ["pyshackle>=1.0"]

[project.urls]
Homepage = "https://github.com/Fame510/SINGULARITY"
Source = "https://github.com/Fame510/SINGULARITY"

[tool.setuptools.packages.find]
where = ["."]
include = ["singularity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Generated protobuf stubs (checked in; regenerate per grpc_client.py docs)
"singularity/integrations/singularity_pb2.py" = ["E501"]
"singularity/integrations/singularity_pb2_grpc.py" = ["F401"]
