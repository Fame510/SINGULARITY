[package]
name = "singularity-transport"
version = "0.1.0"
edition = "2021"
description = "SINGULARITY RDMA/RoCE v2 Transport Fabric — Zero-copy GPU-to-GPU memory movement"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
tracing = "0.1"

# NOTE: no RDMA dependency is declared. The previously declared
# `rdma = "0.1"` never existed on crates.io (and the 0.3 line's own
# dependency chain is broken upstream), so this crate could not even
# resolve dependencies, let alone build. The crate's sources never used
# it. The production RDMA transport is the UCX nerve in the proprietary
# engine; this crate carries the open fabric API and fails loudly on
# operations that need the backend (see src/fabric.rs).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
